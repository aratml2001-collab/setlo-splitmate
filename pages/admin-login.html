<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Setlo Admin — Log In</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body class="text-slate-800 min-h-screen flex items-center justify-center" style="background:linear-gradient(160deg,#0f766e,#0f172a);">
<div class="w-full max-w-sm mx-4">
  <div class="card p-8">
    <div class="flex flex-col items-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-teal-600 flex items-center justify-center text-white text-xl font-bold mb-3">S</div>
      <h1 class="text-xl font-bold text-slate-900">Setlo Admin Panel</h1>
      <p class="text-xs text-slate-500 mt-1">App manager access only</p>
    </div>
    <form class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-600">Admin Email</label>
        <input type="email" class="input mt-1" value="admin@setlo.app" />
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-600">Password</label>
        <input type="password" class="input mt-1" value="••••••••" />
      </div>
      <a href="admin-dashboard.html" class="btn btn-primary w-full">Log In to Admin Panel</a>
    </form>
    <p class="text-center text-xs text-slate-400 mt-6">
      Not an admin? <a href="register.html" class="font-semibold text-teal-600">Go to user log in</a>
    </p>
  </div>
  <p class="text-center text-xs text-teal-100/70 mt-4">Setlo · Internal tool for platform oversight, not end users</p>
</div>
</body>
</html>
