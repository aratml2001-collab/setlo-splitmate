<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Setlo — Sign In</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body class="auth text-slate-800">
<div class="device flex flex-col" style="background:#fff;">
  <div class="island"></div>

  <!-- Teal header -->
  <div class="auth-hero px-6 pt-14 sm:pt-16 pb-14">
    <div class="relative z-10 flex items-center justify-between">
      <div class="flex items-center gap-2.5 text-white">
        <span class="brand-mark">₱</span>
        <span class="text-[28px] font-extrabold tracking-tight">setlo</span>
      </div>
      <span class="text-[11px] font-bold text-white bg-white/20 rounded-full px-2.5 py-1">v1.0.0 Beta</span>
    </div>
    <h1 class="relative z-10 text-[26px] font-extrabold text-white tracking-tight mt-7">Welcome back 👋</h1>
  </div>

  <!-- White sheet -->
  <div class="auth-sheet flex-1 flex flex-col px-6 pt-7 pb-5">
    <form class="space-y-4" onsubmit="return false;">
      <div>
        <label class="field-label">Email / Username</label>
        <div class="input-wrap">
          <svg class="input-lead w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 7l9 6 9-6"/></svg>
          <input type="text" class="input-soft has-lead is-focus" placeholder="you@email.com" value="miguel@setlo.app" />
        </div>
      </div>

      <div>
        <label class="field-label">Password</label>
        <div class="input-wrap">
          <svg class="input-lead w-[18px] h-[18px] text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path stroke-linecap="round" d="M8 11V8a4 4 0 018 0v3"/></svg>
          <input id="pw" type="password" class="input-soft has-lead has-trail" placeholder="Enter your password" />
          <button type="button" class="input-icon" onclick="togglePw('pw', this)" aria-label="Show password">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.04 12.32a1 1 0 010-.64C3.42 7.51 7.36 4.5 12 4.5s8.57 3.01 9.96 7.18a1 1 0 010 .64C20.58 16.49 16.64 19.5 12 19.5s-8.57-3.01-9.96-7.18z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="flex justify-end mt-2.5">
          <a href="#" class="text-[13px] font-bold text-teal-700 hover:underline">Forgot password?</a>
        </div>
      </div>

      <a href="dashboard.html" class="btn-pill btn-pill-primary">Sign In</a>
    </form>

    <div class="flex items-center gap-3 my-5">
      <div class="flex-1 h-px bg-slate-200"></div>
      <span class="text-[12px] font-medium text-slate-500">or continue with</span>
      <div class="flex-1 h-px bg-slate-200"></div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button type="button" class="btn-pill btn-pill-soft">
        <svg class="w-[16px] h-[16px]" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Google
      </button>
      <button type="button" class="btn-pill btn-pill-soft">
        <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path fill="#fff" d="M15.12 15.47l.53-3.47h-3.33V9.75c0-.95.47-1.87 1.96-1.87h1.51V4.93s-1.37-.23-2.69-.23c-2.74 0-4.53 1.66-4.53 4.66V12H5.53v3.47h3.04V24a12.1 12.1 0 003.75 0v-8.53h2.8z"/></svg>
        Facebook
      </button>
    </div>

    <div class="flex-1 min-h-[40px]"></div>

    <p class="text-center text-sm text-slate-600">
      Don't have an account? <a href="register.html" class="font-bold text-teal-700 hover:underline">Sign up</a>
    </p>
    <p class="text-center text-[11px] text-slate-400 mt-2">
      App manager? <a href="admin-login.html" class="hover:text-teal-600">Admin Panel</a> · © 2026 Setlo
    </p>
    <div class="home-bar mt-4"></div>
  </div>
</div>

<script>
function togglePw(id, btn) {
  const el = document.getElementById(id);
  const show = el.type === 'password';
  el.type = show ? 'text' : 'password';
  btn.style.color = show ? '#0d9488' : '';
}
</script>
</body>
</html>
