<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Setlo — Create Account</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body class="auth text-slate-800">
<div class="device flex flex-col" style="background:#fff;">
  <div class="island"></div>

  <!-- Teal header -->
  <div class="auth-hero px-6 pt-14 sm:pt-16 pb-14">
    <div class="relative z-10 flex items-center justify-between">
      <a href="login.html" class="w-9 h-9 rounded-xl bg-white/20 border border-white/30 flex items-center justify-center text-white" aria-label="Back">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m6-6l-6 6 6 6"/></svg>
      </a>
      <div class="flex items-center gap-2 text-white">
        <span class="brand-mark" style="width:28px;height:28px;border-radius:8px;font-size:.85rem;">₱</span>
        <span class="text-[22px] font-extrabold tracking-tight">setlo</span>
      </div>
    </div>
    <h1 class="relative z-10 text-[26px] font-extrabold text-white tracking-tight mt-6">Create account</h1>
    <p class="relative z-10 text-[13px] text-teal-50/90 mt-1">Start splitting bills with your barkada in seconds.</p>
  </div>

  <!-- White sheet -->
  <div class="auth-sheet flex-1 flex flex-col px-6 pt-7 pb-5">
    <form class="space-y-4" onsubmit="return false;">
      <div>
        <label class="field-label">Full Name</label>
        <div class="input-wrap">
          <svg class="input-lead w-[18px] h-[18px] text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path stroke-linecap="round" d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></svg>
          <input type="text" class="input-soft has-lead" placeholder="Juan Dela Cruz" />
        </div>
      </div>

      <div>
        <label class="field-label">Email</label>
        <div class="input-wrap">
          <svg class="input-lead w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 7l9 6 9-6"/></svg>
          <input type="email" class="input-soft has-lead is-focus" placeholder="you@email.com" value="miguel@setlo.app" />
        </div>
        <p class="flex items-center gap-1.5 text-[12px] font-medium text-orange-500 mt-2 ml-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/></svg>
          We'll send a verification link to this address
        </p>
      </div>

      <div>
        <label class="field-label">Preferred Payment Method</label>
        <div class="input-wrap">
          <svg class="input-lead w-[18px] h-[18px] text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path stroke-linecap="round" d="M3 10h18M7 15h3"/></svg>
          <select class="input-soft has-lead has-trail appearance-none cursor-pointer">
            <option>GCash</option>
            <option>Maya</option>
            <option>Bank Transfer</option>
            <option>Cash</option>
          </select>
          <svg class="input-icon w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>

      <div>
        <label class="field-label">Password</label>
        <div class="input-wrap">
          <svg class="input-lead w-[18px] h-[18px] text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path stroke-linecap="round" d="M8 11V8a4 4 0 018 0v3"/></svg>
          <input id="pw" type="password" class="input-soft has-lead has-trail" placeholder="Create a password" />
          <button type="button" class="input-icon" onclick="togglePw('pw', this)" aria-label="Show password">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.04 12.32a1 1 0 010-.64C3.42 7.51 7.36 4.5 12 4.5s8.57 3.01 9.96 7.18a1 1 0 010 .64C20.58 16.49 16.64 19.5 12 19.5s-8.57-3.01-9.96-7.18z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div>
        <label class="field-label">Confirm Password</label>
        <div class="input-wrap">
          <svg class="input-lead w-[18px] h-[18px] text-slate-400" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path stroke-linecap="round" d="M8 11V8a4 4 0 018 0v3"/></svg>
          <input id="pw2" type="password" class="input-soft has-lead has-trail" placeholder="Re-enter password" />
          <button type="button" class="input-icon" onclick="togglePw('pw2', this)" aria-label="Show password">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.04 12.32a1 1 0 010-.64C3.42 7.51 7.36 4.5 12 4.5s8.57 3.01 9.96 7.18a1 1 0 010 .64C20.58 16.49 16.64 19.5 12 19.5s-8.57-3.01-9.96-7.18z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <label class="flex items-start gap-2.5 text-[13px] text-slate-500 pt-1 cursor-pointer">
        <input type="checkbox" checked class="w-4 h-4 mt-0.5 accent-teal-600" />
        <span>I agree to the <a href="#" class="font-bold text-teal-700">Terms &amp; Conditions</a> and <a href="#" class="font-bold text-teal-700">Privacy Policy</a></span>
      </label>

      <a href="dashboard.html" class="btn-pill btn-pill-primary">Create Account</a>
    </form>

    <div class="flex-1 min-h-[24px]"></div>

    <p class="text-center text-sm text-slate-600 mt-5">
      Already have an account? <a href="login.html" class="font-bold text-teal-700 hover:underline">Sign in</a>
    </p>
    <div class="home-bar mt-4"></div>
  </div>
</div>

<script>
function togglePw(id, btn) {
  const el = document.getElementById(id);
  const show = el.type === 'password';
  el.type = show ? 'text' : 'password';
  btn.style.color = show ? '#0d9488' : '';
}
</script>
</body>
</html>
