<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Setlo — Assign Items</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/style.css" />
<style>
  .mchip { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 14px 0 5px; border-radius:999px; background:#fff; border:1.5px solid #e2e8f0; font-size:13px; font-weight:700; color:#0f172a; white-space:nowrap; transition:all .15s; }
  .mchip.on { background:#e6f7f4; border-color:#14b8a6; color:#0f766e; }
  .cbox { width:26px; height:26px; border-radius:8px; border:2px solid #cbd5e1; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s; }
  .cbox.on { background:#14b8a6; border-color:#14b8a6; }
  .no-scrollbar::-webkit-scrollbar { display:none; }
</style>
</head>
<body class="app text-slate-800">
<div class="device app-body flex flex-col">
  <div class="island"></div>

  <!-- Header -->
  <div class="app-hero px-5 pt-14 sm:pt-16 pb-5">
    <div class="flex items-center gap-3">
      <a href="review-items.html" class="glass-btn" aria-label="Back">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <div>
        <h1 class="text-[19px] font-extrabold tracking-tight leading-tight">Assign Items</h1>
        <p class="text-[12px] font-medium text-teal-50/90">Tap who shared each item</p>
      </div>
    </div>
  </div>

  <!-- Steps -->
  <div class="steps">
    <div class="step done"><span class="dot">✓</span>Scan</div>
    <div class="step-line done"></div>
    <div class="step done"><span class="dot">✓</span>Review</div>
    <div class="step-line done"></div>
    <div class="step current"><span class="dot">3</span>Assign</div>
  </div>

  <div class="flex-1 pt-4 pb-4">
    <!-- Member chips -->
    <div id="chips" class="flex gap-2 overflow-x-auto no-scrollbar px-5 pb-1"></div>

    <!-- Items -->
    <div id="items" class="px-5 mt-3 space-y-3"></div>

    <!-- Shared charges -->
    <div class="mx-5 mt-3 rounded-[18px] bg-teal-50/70 border border-teal-100 px-4 py-3 flex items-center justify-between">
      <div>
        <p class="font-bold text-[13px] text-teal-900">Tax + service charge</p>
        <p class="text-[12px] text-teal-700/80">Split equally · <span id="extra-each"></span> each</p>
      </div>
      <span class="font-extrabold text-[14px] text-teal-900">₱90.00</span>
    </div>

    <!-- Unassigned warning -->
    <p id="unassigned" class="mx-5 mt-3 text-[12px] font-semibold text-rose-500"></p>
  </div>

  <!-- Dock -->
  <div class="dock">
    <div class="dock-inner">
      <div>
        <p id="dock-label" class="text-[11px] font-medium text-slate-400">Miguel's share</p>
        <p id="dock-share" class="text-[21px] font-extrabold text-white tracking-tight leading-tight">₱0.00</p>
      </div>
      <button onclick="finish()" class="dock-btn">Finish &amp; send</button>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="nav2">
    <a href="dashboard.html">
      <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 11l9-7 9 7M5 9.5V20h5v-5h4v5h5V9.5"/></svg>
      Dashboard
    </a>
    <a href="my-bills.html">
      <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 3h12v18l-3-2-3 2-3-2-3 2V3zM9 8h6M9 12h6"/></svg>
      Bills
    </a>
    <a href="scan-receipt.html" class="active">
      <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2M8 12h8"/></svg>
      Scan
    </a>
    <a href="my-settlements.html">
      <svg class="w-[22px] h-[22px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path stroke-linecap="round" stroke-linejoin="round" d="M16 13h2M3 10h14a2 2 0 012 2"/></svg>
      Settle
    </a>
  </nav>

  <div id="toast" class="hidden absolute left-1/2 -translate-x-1/2 bottom-40 z-40 bg-rose-500 text-white text-[12px] font-bold px-4 py-2.5 rounded-full shadow-lg whitespace-nowrap"></div>
</div>

<script src="../assets/app.js"></script>
<script>
const MEMBERS = {
  MI: { name: 'Miguel', color: '#0f766e' },
  DA: { name: 'Dani',   color: '#f43f5e' },
  CH: { name: 'Chris',  color: '#f59e0b' },
  AN: { name: 'Ana',    color: '#818cf8' },
};
const EXTRAS = 90;
const items = [
  { name: 'Chicken Inasal', qty: 2, price: 358, who: ['MI', 'DA'] },
  { name: 'Bangus Sisig',   qty: 1, price: 149, who: [] },
  { name: 'Rice',           qty: 3, price: 135, who: ['MI', 'DA', 'CH'] },
  { name: 'Halo-Halo',      qty: 2, price: 178, who: ['MI', 'CH'] },
  { name: 'Iced Tea',       qty: 4, price: 260, who: ['DA', 'AN'] },
  { name: 'Buko Pandan',    qty: 1, price: 70,  who: ['AN'] },
];
let active = 'MI';

const peso = n => '₱' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const av = (id, size) =>
  `<span class="av" style="background:${MEMBERS[id].color};width:${size}px;height:${size}px;font-size:${size * 0.36}px;box-shadow:none">${id}</span>`;
const check = '<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
const count = Object.keys(MEMBERS).length;

function shareOf(id) {
  return items.reduce((s, it) => s + (it.who.includes(id) ? it.price / it.who.length : 0), 0) + EXTRAS / count;
}

function render() {
  document.getElementById('chips').innerHTML = Object.keys(MEMBERS).map(id =>
    `<button onclick="pick('${id}')" class="mchip ${id === active ? 'on' : ''}">${av(id, 28)}${MEMBERS[id].name}</button>`
  ).join('');

  document.getElementById('items').innerHTML = items.map((it, i) => {
    const on = it.who.includes(active);
    const n = it.who.length;
    const meta = n === 0 ? '<span class="text-rose-500 font-semibold">not assigned</span>'
               : n === 1 ? MEMBERS[it.who[0]].name + ' only'
               : 'shared by ' + n;
    return `<button onclick="toggle(${i})" class="tile w-full text-left p-4 flex items-center gap-3 ${on ? '!border-teal-200' : ''}">
      <div class="flex-1 min-w-0">
        <p class="font-bold text-[14px] text-slate-900">${it.name}${it.qty > 1 ? ' ×' + it.qty : ''}</p>
        <p class="text-[12px] text-slate-400 mt-0.5">${peso(it.price)} · ${meta}</p>
      </div>
      <span class="cbox ${on ? 'on' : ''}">${on ? check : ''}</span>
    </button>`;
  }).join('');

  document.getElementById('extra-each').textContent = peso(EXTRAS / count);
  document.getElementById('dock-label').textContent = MEMBERS[active].name + "'s share";
  document.getElementById('dock-share').textContent = peso(shareOf(active));

  const left = items.filter(it => !it.who.length);
  document.getElementById('unassigned').textContent = left.length
    ? left.length + ' item' + (left.length > 1 ? 's' : '') + ' still unassigned (' + peso(left.reduce((s, it) => s + it.price, 0)) + ')'
    : '';
}

function pick(id) { active = id; render(); }

function toggle(i) {
  const who = items[i].who;
  items[i].who = who.includes(active) ? who.filter(x => x !== active) : who.concat(active);
  render();
}

function finish() {
  const left = items.filter(it => !it.who.length);
  if (left.length) {
    const t = document.getElementById('toast');
    t.textContent = 'Assign ' + left.map(it => it.name).join(', ') + ' first';
    t.classList.remove('hidden');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), 2200);
    return;
  }
  location.href = 'bill-detail.html';
}

render();
</script>
</body>
</html>
